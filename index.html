<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le journal de Shinkiri Renjiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Shippori+Mincho:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --crimson-deep: #140306;
            --crimson-main: #800f2f;
            --crimson-bright: #e63946;
            --gold-accent: #e9c46a;
            --paper-bg: #1a070a;
            --paper-light: #240a0e;
            --ink-cream: #f8ece4;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #070102;
            color: var(--ink-cream);
            overflow-x: hidden;
            user-select: none;
        }

        .font-jp { font-family: 'Shippori Mincho', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }

        /* Arrière-plan thème forêt écarlate */
        .bg-crimson-forest {
            background-image:
                radial-gradient(circle at 50% 25%, rgba(164, 22, 26, 0.25) 0%, rgba(7, 1, 2, 0.96) 75%),
                url('https://i.pinimg.com/1200x/a7/b8/00/a7b80065c23363811ba67a273fb00d73.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Couverture du carnet */
        .leather-cover {
            background:
                radial-gradient(circle at 25% 20%, rgba(230, 57, 70, 0.16), transparent 55%),
                linear-gradient(145deg, #28060b 0%, #160306 55%, #0c0103 100%);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.95),
                inset 0 0 0 2px rgba(233, 196, 106, 0.25),
                inset 0 0 40px rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(230, 57, 70, 0.45);
        }

        .spine-binding {
            background: linear-gradient(90deg, #090102 0%, #4a0612 35%, #1d0307 70%, #090102 100%);
            box-shadow: inset -4px 0 12px rgba(0, 0, 0, 0.9);
        }

        /* Sceau Hanko */
        .hanko-seal {
            background: radial-gradient(circle at 30% 30%, #ff4d6d, #9d0208 65%, #370617 100%);
            border: 2px solid rgba(233, 196, 106, 0.75);
            box-shadow:
                0 0 22px rgba(230, 57, 70, 0.55),
                inset 0 2px 6px rgba(255, 255, 255, 0.25);
        }

        /* Livre/Page interne */
        .journal-book {
            background: linear-gradient(180deg, #21080c 0%, #170508 50%, #120406 100%);
            border: 1px solid rgba(230, 57, 70, 0.35);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.95),
                0 0 35px rgba(128, 15, 47, 0.25),
                inset 0 0 50px rgba(0, 0, 0, 0.65);
        }

        .center-crease {
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0, 0, 0, 0.55) 48%,
                rgba(233, 196, 106, 0.12) 50%,
                rgba(0, 0, 0, 0.55) 52%,
                transparent 100%);
        }

        /* Animations */
        .book-open-anim {
            animation: bookReveal 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes bookReveal {
            0% { opacity: 0; transform: scale(0.92) rotateX(12deg); }
            100% { opacity: 1; transform: scale(1) rotateX(0deg); }
        }

        .page-turn-anim {
            animation: pageFade 0.45s ease-out forwards;
        }

        @keyframes pageFade {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Pétales de Sakura */
        .sakura-petal {
            position: absolute;
            background: linear-gradient(135deg, #ff5c77 0%, #800f2f 100%);
            border-radius: 14px 2px 14px 2px;
            pointer-events: none;
            animation: sakuraFall linear infinite;
        }

        @keyframes sakuraFall {
            0% { transform: translateY(-6vh) translateX(0) rotate(0deg); opacity: 0; }
            12% { opacity: 0.75; }
            88% { opacity: 0.65; }
            100% { transform: translateY(106vh) translateX(90px) rotate(640deg); opacity: 0; }
        }

        .journal-scroll::-webkit-scrollbar { width: 6px; }
        .journal-scroll::-webkit-scrollbar-track { background: rgba(12, 2, 4, 0.7); }
        .journal-scroll::-webkit-scrollbar-thumb { background: rgba(230, 57, 70, 0.55); border-radius: 999px; }
    </style>
</head>
<body class="bg-crimson-forest min-h-screen flex flex-col justify-between items-center relative">

    <div id="sakuraLayer" class="fixed inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- Barre supérieure : Audio & Titre -->
    <header class="w-full max-w-6xl px-4 py-4 md:px-8 md:py-6 flex flex-wrap justify-between items-center gap-4 z-40">
        <div class="flex items-center space-x-3">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_10px_#ff4d6d]"></span>
            <span class="font-jp text-xs md:text-sm tracking-[0.22em] text-red-200/90 uppercase">
                神桐の記録 · Journal Intime
            </span>
        </div>

        <div class="flex items-center space-x-3 bg-black/70 backdrop-blur-md px-4 py-2 rounded-full border border-red-800/50 shadow-xl">
            <button id="audioToggle" type="button" onclick="toggleMusic()" aria-label="Musique"
                class="text-red-300 hover:text-amber-200 transition flex items-center justify-center focus:outline-none">
                <svg id="iconPlay" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                </svg>
                <svg id="iconPause" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5 0a1 1 0 012 0v4a1 1 0 11-2 0V8z" clip-rule="evenodd"/>
                </svg>
            </button>
            <span class="font-cinzel text-[11px] tracking-wider text-red-300/80 uppercase hidden sm:inline">Volume</span>
            <input id="volumeRange" type="range" min="0" max="1" step="0.01" value="0.6"
                oninput="updateVolume(this.value)" class="w-20 md:w-28 accent-red-500 cursor-pointer">
        </div>
    </header>

    <main class="flex-1 w-full max-w-5xl px-4 py-4 md:py-8 flex items-center justify-center z-20">

        <!-- VUE : CARNET FERMÉ -->
        <section id="closedBookView" class="w-full flex flex-col items-center justify-center py-6">
            <div onclick="openJournal()" role="button" tabindex="0"
                onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openJournal();}"
                class="leather-cover group relative w-72 sm:w-80 md:w-96 h-[430px] sm:h-[470px] rounded-r-2xl rounded-l-md flex cursor-pointer transition-all duration-500 hover:-translate-y-2 hover:shadow-[0_30px_75px_rgba(164,22,26,0.35)]">

                <div class="spine-binding w-7 sm:w-8 h-full rounded-l-md border-r border-amber-400/20 flex flex-col justify-between py-8 items-center">
                    <span class="w-2 h-2 rounded-full bg-amber-400/50"></span>
                    <span class="w-2 h-2 rounded-full bg-amber-400/50"></span>
                    <span class="w-2 h-2 rounded-full bg-amber-400/50"></span>
                </div>

                <div class="flex-1 m-4 border border-amber-300/30 rounded-lg p-6 flex flex-col justify-between items-center text-center relative">
                    <span class="w-3 h-3 border-t-2 border-l-2 border-amber-300/60 absolute top-2 left-2"></span>
                    <span class="w-3 h-3 border-t-2 border-r-2 border-amber-300/60 absolute top-2 right-2"></span>
                    <span class="w-3 h-3 border-b-2 border-l-2 border-amber-300/60 absolute bottom-2 left-2"></span>
                    <span class="w-3 h-3 border-b-2 border-r-2 border-amber-300/60 absolute bottom-2 right-2"></span>

                    <div class="pt-2">
                        <p class="font-jp text-xs tracking-[0.35em] text-red-300/80 mb-2">十一歳より</p>
                        <p class="font-cinzel text-[11px] tracking-[0.25em] text-amber-200/70 uppercase">Commencé à onze ans</p>
                    </div>

                    <div class="my-4 flex flex-col items-center">
                        <div class="hanko-seal w-16 h-16 rounded-full flex items-center justify-center font-jp text-2xl font-bold text-amber-100 mb-5 transition-transform duration-500 group-hover:scale-110 group-hover:rotate-6">
                            愛
                        </div>
                        <h1 class="font-cinzel text-2xl sm:text-3xl font-bold text-amber-100 tracking-wide leading-snug">
                            Le journal de<br>
                            <span class="text-red-400">Shinkiri Renjiro</span>
                        </h1>
                    </div>

                    <div class="pb-1">
                        <div class="w-16 h-[1px] bg-gradient-to-r from-transparent via-amber-300/60 to-transparent mx-auto mb-3"></div>
                        <p class="font-cinzel text-xs tracking-[0.2em] text-red-200/90 uppercase group-hover:text-amber-200 transition">
                            Ouvrir le carnet
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <!-- VUE : CARNET OUVERT -->
        <section id="openBookView" class="hidden w-full book-open-anim">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4 px-1">
                <div class="flex flex-wrap items-center gap-1.5 sm:gap-2" id="chapterTabs"></div>

                <button type="button" onclick="closeJournal()"
                    class="font-cinzel text-xs tracking-widest uppercase px-4 py-2 rounded-full bg-black/70 hover:bg-red-950/80 text-red-200 hover:text-amber-200 border border-red-800/60 transition">
                    Fermer le carnet ✕
                </button>
            </div>

            <div class="journal-book rounded-2xl relative overflow-hidden">
                <div class="hidden lg:block center-crease absolute inset-y-0 left-1/2 -translate-x-1/2 w-10 pointer-events-none z-10"></div>

                <div class="px-6 pt-7 pb-5 md:px-12 border-b border-red-900/40 flex flex-col md:flex-row md:items-end md:justify-between gap-2 relative z-20">
                    <div>
                        <p id="chapterSubtitle" class="font-jp text-xs tracking-[0.25em] text-red-400/85 uppercase mb-1"></p>
                        <h2 id="chapterTitle" class="font-cinzel text-2xl md:text-4xl font-bold text-amber-100 tracking-wide"></h2>
                    </div>
                    <p id="pageIndicator" class="font-cinzel text-xs tracking-[0.2em] text-red-300/75 uppercase"></p>
                </div>

                <div id="chapterContent" class="journal-scroll page-turn-anim px-6 py-7 md:px-14 md:py-10 max-h-[62vh] overflow-y-auto relative z-20 space-y-5 text-lg md:text-[21px] leading-[1.85] text-amber-50/90">
                </div>

                <div class="px-6 py-4 md:px-12 bg-black/45 border-t border-red-900/40 flex items-center justify-between gap-4 relative z-20">
                    <button id="prevBtn" type="button" onclick="prevChapter()"
                        class="font-cinzel text-xs md:text-sm tracking-widest uppercase px-4 py-2 rounded-full border border-red-800/60 text-red-200 hover:bg-red-950/80 hover:text-amber-200 disabled:opacity-35 disabled:pointer-events-none transition">
                        ← Page précédente
                    </button>

                    <span class="font-jp text-xs text-red-400/70 tracking-widest hidden sm:inline">黒羽 · 紅蓮の記憶</span>

                    <button id="nextBtn" type="button" onclick="nextChapter()"
                        class="font-cinzel text-xs md:text-sm tracking-widest uppercase px-4 py-2 rounded-full border border-red-800/60 text-red-200 hover:bg-red-950/80 hover:text-amber-200 disabled:opacity-35 disabled:pointer-events-none transition">
                        Page suivante →
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="w-full py-3 px-4 text-center text-xs font-jp tracking-[0.2em] text-red-300/45 z-20">
        Le journal de Shinkiri Renjiro — Un livre commencé à l'âge de onze ans..
    </footer>

    <!-- Audio Solo Leveling -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/oc9nps.mp3" type="audio/mpeg">
    </audio>

    <script>
        const chapters = [
            {
                id: 0,
                tab: "Chapitre 1",
                kanji: "第一章 · 友を求める少年",
                title: "1 — Le début d'un enfant qui souhaite se faire des amis..",
                entries: [
                    "Je suis devenu un Pourfendeur.. Enfin, pas encore vraiment, je suis encore un aspirant, mais je vais bientôt pouvoir le devenir !",
                    "Aujourd'hui, j'ai rencontré plusieurs personnes. Il y avait Subaru, Hoshiko, Ito et d'autres personnes dont je ne me souviens pas encore très bien des noms. Ils ont l'air gentils, enfin, certains plus que d'autres. J'ai aussi rencontré une fille qui s'appelle Kuroha.",
                    "Elle est assez étrange. Elle ne parle pas beaucoup et elle a souvent l'air de ne pas vouloir être là. Les autres ne sont pas très gentils avec elle non plus. Hoshiko m'a même dit de ne pas lui parler. Je ne sais pas pourquoi.. Peut-être qu'elle a fait quelque chose de mal ? Ou peut-être qu'ils ne l'aiment simplement pas.",
                    "Je ne comprends pas vraiment. Même si elle est froide et qu'elle ne sourit pas beaucoup, elle a sûrement envie d'avoir des amis comme tout le monde. Maman m'a toujours dit qu'il fallait essayer de comprendre les autres avant de les juger. Alors je vais essayer de lui parler quand même.",
                    "Je ne sais pas si elle voudra être mon amie, mais j'aimerais bien. Peut-être qu'un jour elle me sourira. Ce serait bien.",
                    "Aujourd'hui, j'ai aussi pensé à maman.. Elle me manque beaucoup. Depuis qu'elle est partie, il y a des choses que je ne comprends plus vraiment. Je repense souvent à l'accident et je me demande encore si j'aurais pu faire quelque chose pour l'empêcher. Je crois que je me sentirai toujours un peu responsable..",
                    "Avant de partir, elle m'avait dit que je devais trouver des amis, mais aussi une raison de vivre. Je ne sais pas encore exactement ce que ça veut dire. Peut-être que je finirai par comprendre en grandissant.",
                    "Pour le moment, je veux simplement devenir un Pourfendeur et protéger les gens qui comptent pour moi.",
                    "...",
                    "La Sélection Finale est terminée !",
                    "J'ai réussi.. Je suis vivant et je vais pouvoir continuer à avancer. J'ai eu peur, parfois vraiment très peur, mais je ne veux pas abandonner. Je veux devenir assez fort pour protéger les autres.",
                    "Et surtout.. Je veux protéger Kuroha.",
                    "Je ne sais pas pourquoi j'écris ça en particulier. Elle n'est pas forcément gentille avec moi et elle ne me montre pas vraiment qu'elle veut être mon amie. Pourtant, quand je la vois, je me dis que je ne voudrais pas qu'il lui arrive quelque chose. Je sais que c'est étrange, mais c'est comme ça.",
                    "Elle aussi veut rejoindre le Souffle de la Brume. Alors je vais essayer d'y entrer avec elle. Peut-être qu'on pourra s'entraîner ensemble, faire des missions ensemble et, un jour, devenir de vrais amis.",
                    "Je ne sais pas pourquoi, mais j'aimerais bien qu'elle soit encore là lorsque nous aurons grandi. J'aimerais pouvoir la voir réussir et lui montrer que moi aussi, je peux devenir quelqu'un de fort.",
                    "Je veux être assez fort pour ne plus avoir à regarder quelqu'un disparaître sans rien pouvoir faire.",
                    "...",
                    "J'ai réussi le recrutement du Souffle de la Brume !",
                    "Kuroha et Asmita étaient présents aussi. Je suis vraiment content d'avoir pu rejoindre cet ordre, même si je sais que je vais devoir travailler beaucoup plus dur maintenant. Ils sont tous les deux assez forts et je ne veux pas rester derrière eux.",
                    "Je dois progresser. Je dois apprendre, m'entraîner et devenir meilleur.",
                    "Je repense souvent à ce que maman m'avait dit. Trouver des amis.. Trouver une raison de vivre. Je crois que je commence à comprendre un peu. Peut-être que ma raison de vivre, ce sera de protéger les personnes que je rencontrerai sur mon chemin.",
                    "Je ne veux plus perdre quelqu'un comme j'ai perdu maman.",

                    "Je suis devenu Kanoto du Souffle de la Brume !",
                    "Aujourd'hui, je suis revenu d'une mission avec Kuroha. Nous avons dû nous rendre dans la dimension de Hidan et, pendant un moment, elle est tombée.",

                    "J'ai pourtant l'habitude de voir des personnes se faire blesser pendant les missions, mais lorsque c'est elle.. C'est différent.",
                    "Quand je l'ai vue tomber, j'ai eu peur. Une peur que je ne connaissais pas vraiment. J'avais l'impression que quelque chose de terrible allait arriver si je ne faisais rien. Je voulais simplement qu'elle se relève, qu'elle aille bien et que nous puissions rentrer ensemble.",
                    "Elle est parfois froide, elle me parle peu et je ne sais jamais vraiment ce qu'elle pense de moi. Pourtant, je n'ai pas envie qu'elle disparaisse.",
                    "Je crois que je vais continuer à la protéger. Même si elle ne me le demande pas, même si elle ne comprend pas pourquoi je fais ça.",
                    "Je ne sais pas encore ce que je ressens exactement. Je suis peut-être simplement attaché à elle parce que nous avons commencé à avancer ensemble.",

            {

                tab: "Chapitre 2",

                entries: [

                    "Je veux un jour regarder nos mains devenues ridées et me souvenir de toutes ces années. Je veux pouvoir lui dire que, malgré toutes les difficultés, malgré les erreurs, malgré les moments où nous avons eu peur de nous perdre, je n'ai jamais cessé de l'aimer.",
                    "Je ne sais pas ce que les prochaines pages nous réservent. Je ne sais pas si tout sera toujours facile, ni si je réussirai à ne plus jamais faire d'erreurs. Mais je sais une chose : je veux continuer à écrire notre histoire.",
                    "Je veux voir Kurei grandir, voir Kuroha sourire, partager encore des centaines de soirées avec eux et pouvoir me retourner un jour en me disant que nous avons traversé tout ça ensemble.",
                    "Je veux voir notre famille s'agrandir, entendre les rires de nos enfants dans le domaine et retrouver Kuroha à mes côtés lorsque la journée sera terminée.",
                    "Je veux encore lui offrir des fleurs sans occasion particulière. Je veux encore lui préparer des surprises, lui écrire des mots, lui prendre la main lorsque nous marchons et lui voler quelques baisers lorsqu'elle ne s'y attend pas.",
                    "Je veux encore la faire rire.",
                    "Je veux encore l'entendre m'appeler.",
                    "Je veux encore pouvoir lui dire qu'elle est magnifique, même si je sais que je lui répéterai probablement des centaines de fois.",
                    "Je l'aime.. Et je l'aimerai toute ma vie.",
                    "Je ne sais pas si je pourrai un jour lui faire comprendre toute l'importance qu'elle a prise dans mon existence. Je ne sais même pas si les mots que j'écris ici seront un jour suffisants pour décrire ce que je ressens.",
                    "Mais je veux continuer.",
                    "Je veux continuer à vivre, à apprendre, à devenir meilleur. Pour Kurei, pour Kuroha.. Et aussi pour ce petit garçon que j'étais autrefois, celui qui écrivait dans ce livre en espérant simplement trouver des amis et une raison de vivre.",
                    "Je crois que j'ai trouvé bien plus que ça.",
                    "J'ai trouvé une famille.",
                    "J'ai trouvé une femme que je veux aimer jusqu'à mon dernier souffle. Une femme que je veux choisir chaque jour, même lorsque la vie devient difficile. Une femme dont je veux être fier, que je veux soutenir et auprès de qui je veux continuer à grandir.",
                    "Et lorsque je repense à toutes ces années, je me rends compte que tout a commencé par une simple rencontre.",
                    "Une petite fille qui ne parlait pas beaucoup, qui semblait ne vouloir de personne et que les autres me conseillaient de ne pas approcher.",
                    "Je ne savais pas encore que cette fille deviendrait mon plus grand bonheur.",
                    "Je ne savais pas qu'un jour, je pourrais l'appeler ma femme.",
                    "Je ne savais pas que j'aurais un enfant avec elle, que je construirais un foyer et que je trouverais auprès d'elle cette raison de vivre que maman m'avait demandé de chercher.",
                    "Aujourd'hui, je le sais.",
                    "Et si je pouvais retourner voir le petit Shinkiri qui écrivait ses premières lignes à onze ans, je crois que je lui dirais de ne jamais abandonner. De continuer à avancer, de continuer à croire en ses rencontres et de ne pas avoir peur d'aimer.",
                    "Parce qu'un jour, il rencontrera Kuroha.",
                    "Et elle deviendra.."
                ]
            }
        ];

        let currentChapterIndex = 0;

        // Génération des pétales Sakura
        const sakuraLayer = document.getElementById('sakuraLayer');
        for (let i = 0; i < 28; i++) {
            const petal = document.createElement('div');
            petal.className = 'sakura-petal';
            const size = Math.random() * 8 + 6;
            petal.style.width = `${size}px`;
            petal.style.height = `${size * 1.35}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.animationDuration = `${Math.random() * 6 + 7}s`;
            petal.style.animationDelay = `${Math.random() * 5}s`;
            sakuraLayer.appendChild(petal);
        }

        // Musique
        const bgMusic = document.getElementById('bgMusic');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const volumeRange = document.getElementById('volumeRange');
        bgMusic.volume = parseFloat(volumeRange.value);

        function syncAudioIcons() {
            if (!bgMusic.paused) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
        }

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play().then(syncAudioIcons).catch(() => {});
            } else {
                bgMusic.pause();
                syncAudioIcons();
            }
        }

        function updateVolume(val) {
            bgMusic.volume = parseFloat(val);
        }

        function playPageSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const duration = 0.25;
                const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.08));
                }
                const source = ctx.createBufferSource();
                source.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1100;

                const gain = ctx.createGain();
                gain.gain.value = 0.09 * Math.max(0.2, bgMusic.volume);

                source.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                source.start();
            } catch (e) {}
        }

        // Rendu du Livre
        function renderTabs() {
            const tabsContainer = document.getElementById('chapterTabs');
            tabsContainer.innerHTML = '';

            chapters.forEach((chap, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = chap.tab;
                const isActive = idx === currentChapterIndex;
                btn.className = isActive
                    ? 'font-cinzel text-[11px] sm:text-xs tracking-wider uppercase px-3 py-1.5 rounded-full bg-red-800/80 text-amber-100 border border-amber-300/50 shadow'
                    : 'font-cinzel text-[11px] sm:text-xs tracking-wider uppercase px-3 py-1.5 rounded-full bg-black/55 text-red-200/75 hover:text-amber-100 border border-red-900/45 transition';
                btn.onclick = () => goToChapter(idx);
                tabsContainer.appendChild(btn);
            });
        }

        function renderChapter() {
            const chap = chapters[currentChapterIndex];
            const contentEl = document.getElementById('chapterContent');

            document.getElementById('chapterSubtitle').textContent = chap.kanji;
            document.getElementById('chapterTitle').textContent = chap.title;
            document.getElementById('pageIndicator').textContent = `Chapitre ${currentChapterIndex + 1} / ${chapters.length}`;

            contentEl.classList.remove('page-turn-anim');
            void contentEl.offsetWidth;
            contentEl.classList.add('page-turn-anim');
            contentEl.scrollTop = 0;

            contentEl.innerHTML = '';

            chap.entries.forEach((line) => {
                if (line === '...') {
                    const sep = document.createElement('div');
                    sep.className = 'py-3 flex items-center justify-center gap-3 text-red-400/65 font-cinzel text-sm tracking-[0.5em]';
                    sep.innerHTML = '<span class="w-10 h-[1px] bg-red-800/60"></span><span>• • •</span><span class="w-10 h-[1px] bg-red-800/60"></span>';
                    contentEl.appendChild(sep);
                    return;
                }

                const p = document.createElement('p');
                if (line.startsWith('«') && line.endsWith('»')) {
                    p.className = 'italic text-red-200 pl-5 border-l-2 border-red-500/70 bg-red-950/25 py-2 pr-3 rounded-r';
                } else if (line === 'Et elle deviendra..') {
                    p.className = 'font-cinzel text-xl md:text-2xl text-red-300 tracking-wide pt-4 font-bold';
                }
                p.textContent = line;
                contentEl.appendChild(p);
            });

            document.getElementById('prevBtn').disabled = currentChapterIndex === 0;
            document.getElementById('nextBtn').disabled = currentChapterIndex === chapters.length - 1;

            renderTabs();
        }

        function openJournal() {
            playPageSound();
            document.getElementById('closedBookView').classList.add('hidden');
            document.getElementById('openBookView').classList.remove('hidden');
            renderChapter();

            if (bgMusic.paused) {
                bgMusic.play().then(syncAudioIcons).catch(() => {});
            }
        }

        function closeJournal() {
            playPageSound();
            document.getElementById('openBookView').classList.add('hidden');
            document.getElementById('closedBookView').classList.remove('hidden');
        }

        function goToChapter(index) {
            if (index >= 0 && index < chapters.length && index !== currentChapterIndex) {
                currentChapterIndex = index;
                playPageSound();
                renderChapter();
            }
        }

        function prevChapter() {
            if (currentChapterIndex > 0) {
                currentChapterIndex--;
                playPageSound();
                renderChapter();
            }
        }

        function nextChapter() {
            if (currentChapterIndex < chapters.length - 1) {
                currentChapterIndex++;
                playPageSound();
                renderChapter();
            }
        }
    </script>
</body>
</html>
